<!-- Nachbau des Logos der Berufsausuebungsgemeinschaft Rech.
     Bitte gegen die Originaldatei der Praxis austauschen, sobald sie vorliegt. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
     aria-label="Logo der Urologischen Gemeinschaftspraxis Rech">
  <defs>
    <mask id="rechRing">
      <rect width="64" height="64" fill="#000"/>
      <circle cx="32" cy="32" r="27" fill="#fff"/>
      <circle cx="28.5" cy="29.5" r="15.5" fill="#000"/>
    </mask>
  </defs>
  <g mask="url(#rechRing)">
    <rect x="0"  y="0" width="31" height="64" fill="#868d96"/>
    <rect x="31" y="0" width="33" height="64" fill="#2b3f77"/>
  </g>
</svg>
