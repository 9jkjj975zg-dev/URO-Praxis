<!-- Logo der Urologischen Gemeinschaftspraxis Rech.
     Freigestellt aus der Originaldatei Rech_Vektor.svg der Praxis;
     Pfade und Farben unveraendert uebernommen.

     Beim Laden bauen sich die beiden Sicheln nacheinander auf. Die
     Animation steckt in dieser Datei, laeuft also ueberall, wo das Logo
     eingebunden ist. Wer im Betriebssystem "Bewegung reduzieren"
     eingeschaltet hat, sieht das Logo sofort fertig.

     Wichtig: Die Animation liegt auf eigenen Huellgruppen. Eine CSS-
     Transformation wuerde sonst das transform-Attribut der inneren
     Gruppen ueberschreiben und das Logo aus dem Bild schieben. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="2453 1426 2110 2110"
     role="img" aria-label="Logo der Urologischen Gemeinschaftspraxis Rech"
     style="fill-rule:evenodd;clip-rule:evenodd">
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .teil {
        transform-box: view-box;
        transform-origin: 50% 50%;
        animation: aufbau 700ms cubic-bezier(.22, .78, .3, 1) both;
      }
      .teil--grau { animation-delay: 60ms; }
      .teil--navy { animation-delay: 240ms; }

      @keyframes aufbau {
        from { opacity: 0; transform: rotate(-40deg) scale(.86); }
        to   { opacity: 1; transform: rotate(0deg) scale(1); }
      }
    }
  </style>
  <g class="teil teil--grau">
    <g transform="matrix(1,0,0,1,-1078.18,1110.02)">
      <g transform="matrix(8.33333,0,0,8.33333,0,-2630.93)">
        <path d="M442.134,542.932C431.362,524.468 425.186,502.992 425.186,480.085C425.186,411.101 481.192,355.096 550.175,355.096C573.476,355.096 595.297,361.486 613.975,372.605C619.519,382.192 623.827,392.579 626.681,403.549C616.386,400.802 605.571,399.338 594.417,399.338C525.434,399.338 469.428,455.344 469.428,524.327C469.428,535.289 470.842,545.923 473.498,556.056C462.359,553.104 451.828,548.653 442.134,542.932Z" style="fill:rgb(102,102,102)"/>
      </g>
    </g>
  </g>
  <g class="teil teil--navy">
    <g transform="matrix(1,0,0,1,-1078.18,1110.02)">
      <g transform="matrix(8.33333,0,0,8.33333,0,-2074.88)">
        <path d="M613.821,305.788C650.685,327.566 675.497,367.646 675.497,413.524C675.497,482.576 619.435,538.638 550.383,538.638C504.111,538.638 463.721,513.492 442.079,476.111C460.697,487.11 482.359,493.396 505.533,493.396C574.585,493.396 630.647,437.334 630.647,368.282C630.647,345.502 624.481,324.2 613.821,305.788Z" style="fill:rgb(39,64,136)"/>
      </g>
    </g>
  </g>
</svg>
